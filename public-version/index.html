<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octopus Hunter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0d14;
    --panel: #141625;
    --border: #262a42;
    --text: #e4e7eb;
    --muted: #6b7280;
    --up: #35c77e;
    --down: #e5484d;
    --gold: #d4a72c;
    --urgent: #e5484d;
    --accent: #6d7bf5;
  }
  .dev-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.08em;
    color:var(--accent);
    border:1px solid var(--accent);
    background:rgba(46,168,168,0.12);
    padding:2px 7px;
    border-radius:4px;
  }
  .access-gate{
    position:fixed; inset:0;
    background:var(--bg);
    z-index:200;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .access-gate.hidden{ display:none; }
  .gate-box{
    text-align:center;
    max-width:340px;
    width:100%;
  }
  .gate-box h2{
    font-family:'IBM Plex Mono',monospace;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.03em;
    margin-bottom:4px;
  }
  .gate-sub{
    font-size:11px;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:0.1em;
    margin-bottom:22px;
  }
  .code-input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;
    letter-spacing:0.05em;
    padding:12px 14px;
    border-radius:8px;
    text-align:center;
    margin-bottom:12px;
  }
  .code-input:focus{ outline:none; border-color:var(--accent); }
  .gate-submit{
    width:100%;
    background:var(--accent);
    border:none;
    color:#04120f;
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    font-weight:700;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
  }
  .gate-submit:disabled{ opacity:0.5; cursor:default; }
  .gate-error{
    color:var(--down);
    font-size:12px;
    margin-top:12px;
    min-height:16px;
  }
  .maintenance-banner{
    max-width:1100px;
    margin:0 auto 16px;
    background:rgba(229,72,77,0.10);
    border:2px solid var(--down);
    color:var(--down);
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    text-align:center;
    padding:10px 14px;
    border-radius:0;
    display:none;
  }
  .maintenance-banner.show{ display:block; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:24px 16px 60px;
  }
  body.lang-ar{ font-family:'Tajawal',sans-serif; }
  .ltr{ direction:ltr; unicode-bidi:embed; display:inline-block; }
  header{
    max-width:1100px;
    margin:0 auto 6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  header h1{
    font-family:'IBM Plex Mono',monospace;
    font-size:24px;
    font-weight:700;
    letter-spacing:0.03em;
  }
  header .sub{
    font-size:12px;
    color:var(--gold);
    text-transform:uppercase;
    letter-spacing:0.1em;
    margin-top:2px;
  }
  .top-controls{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .pill-btn{
    background:var(--panel); border:1px solid var(--border); color:var(--muted);
    font-family:'IBM Plex Mono',monospace; font-size:12px; padding:6px 12px;
    border-radius:6px; cursor:pointer;
  }
  select.pill-btn option{
    background:var(--panel);
    color:var(--text);
  }
  .clock{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--muted);
  }
  .tracked-bar{
    max-width:1100px;
    margin:18px auto 26px;
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    padding:14px 0;
  }
  .tracked-bar .label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted);
    margin-bottom:9px;
  }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--muted);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:5px;
    padding:4px 8px;
  }
  .grid{
    max-width:1100px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:14px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
    cursor:pointer;
    transition:border-color .15s ease, transform .1s ease, background .2s ease;
    position:relative;
  }
  .card:hover{ border-color:#3a4356; transform:translateY(-1px); }
  .card.closed{ opacity:0.55; }
  .card.urgent{
    border-color:var(--urgent);
    background:rgba(229,72,77,0.08);
  }
  .card .symbol{
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    font-weight:600;
    margin-bottom:2px;
  }
  .card .dir{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    font-weight:600;
    margin-bottom:6px;
  }
  .dir.up{color:var(--up);}
  .dir.down{color:var(--down);}
  .closed-badge{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.05em;
    padding:2px 6px;
    border-radius:4px;
    margin-bottom:8px;
  }
  .closed-badge.tp{ background:rgba(53,199,126,0.15); color:var(--up); }
  .closed-badge.sl{ background:rgba(229,72,77,0.15); color:var(--down); }
  .confirm-badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    font-weight:600;
    padding:3px 7px;
    border-radius:5px;
    margin-bottom:8px;
  }
  .confirm-badge.tier-3{ background:rgba(212,167,44,0.15); color:var(--gold); }
  .confirm-badge.tier-2{ background:rgba(94,140,214,0.15); color:#5e8cd6; }
  .confirm-badge.tier-1{ background:rgba(107,114,128,0.15); color:var(--muted); }
  .gauge-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    margin:6px 0 10px;
    position:relative;
  }
  .gauge-num{
    font-family:'IBM Plex Mono',monospace;
    font-size:22px;
    font-weight:700;
    position:absolute;
    text-align:center;
  }
  .gauge-label{
    font-size:9px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .card .tf{
    font-size:10px;
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
  }
  .card .countdown{
    font-size:10px;
    font-family:'IBM Plex Mono',monospace;
    text-align:right;
    color:var(--muted);
  }
  .card.urgent .countdown{ color:var(--urgent); font-weight:700; }
  .card .foot-row{
    display:flex; justify-content:space-between; align-items:center;
  }
  .empty{
    max-width:1100px;
    margin:50px auto;
    text-align:center;
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    line-height:1.7;
  }
  .overlay{
    position:fixed; inset:0;
    background:rgba(4,6,10,0.7);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .overlay.show{ display:flex; }
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    max-width:420px;
    width:100%;
    max-height:90vh;
    overflow-y:auto;
    padding:26px;
  }
  .panel-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:18px;
  }
  .panel-head .symbol{
    font-family:'IBM Plex Mono',monospace;
    font-size:20px;
    font-weight:700;
  }
  .panel-head .dir{
    display:inline-block;
    margin-top:6px;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    font-weight:700;
    padding:3px 8px;
    border-radius:5px;
  }
  .dir.up{ background:rgba(53,199,126,0.12); }
  .dir.down{ background:rgba(229,72,77,0.12); }
  .close-btn{
    background:none; border:none; color:var(--muted);
    font-size:20px; cursor:pointer; line-height:1;
  }
  .confidence-big{ text-align:center; margin:8px 0 14px; }
  .confidence-big .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:44px; font-weight:700; color:var(--gold);
  }
  .confidence-big .lbl{
    font-size:11px; color:var(--muted);
    text-transform:uppercase; letter-spacing:0.08em; margin-top:2px;
  }
  .countdown-big{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--muted);
    margin-bottom:18px;
    padding:8px;
    border-radius:8px;
    border:1px solid var(--border);
  }
  .countdown-big.urgent{ color:var(--urgent); border-color:var(--urgent); background:rgba(229,72,77,0.08); font-weight:700; }
  .levels{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    margin-bottom:18px;
  }
  .level-box{
    background:#0e1119;
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 8px;
    text-align:center;
  }
  .level-box .l-label{
    font-size:9px; color:var(--muted);
    text-transform:uppercase; letter-spacing:0.05em; margin-bottom:5px;
  }
  .level-box .l-value{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px; font-weight:600;
  }
  .level-box.entry .l-value{ color:var(--text); }
  .level-box.sl .l-value{ color:var(--down); }
  .level-box.tp .l-value{ color:var(--up); }
  .meta-row{
    display:flex; justify-content:space-between;
    font-size:11px; color:var(--muted);
    margin-bottom:10px;
    font-family:'IBM Plex Mono',monospace;
  }
  .components{ margin:16px 0 18px; }
  .comp-row{ margin-bottom:12px; }
  .comp-row .top{
    display:flex; justify-content:space-between;
    font-size:12px; margin-bottom:5px;
  }
  .comp-row .top .name{ color:var(--muted); }
  .comp-row .top .val{ font-family:'IBM Plex Mono',monospace; }
  .bar-track{ height:5px; background:#1c2230; border-radius:3px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--gold); border-radius:3px; }
  .disclaimer{ font-size:11px; line-height:1.6; color:var(--muted); }

  body.lang-ar .dir, body.lang-ar .closed-badge, body.lang-ar .confirm-badge,
  body.lang-ar .gauge-label, body.lang-ar .tf, body.lang-ar .countdown,
  body.lang-ar .l-label, body.lang-ar .lbl, body.lang-ar .meta-row,
  body.lang-ar .comp-row .name, body.lang-ar .disclaimer, body.lang-ar .empty,
  body.lang-ar .label { font-family:'Tajawal',sans-serif; }

  @media (max-width:480px){
    body{ padding:16px 12px 50px; }
    header h1{ font-size:20px; }
    .grid{ grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
    .card{ padding:12px; }
    .levels{ grid-template-columns:1fr; }
    #logoImg{ width:220px !important; height:220px !important; }
    #gateLogo{ width:220px !important; height:220px !important; }
  }
</style>
</head>
<body id="bodyRoot">

<div class="access-gate" id="accessGate">
  <div class="gate-box">
    <img id="gateLogo" src="/assets/logo-en.png" alt="" style="width:300px; height:300px; object-fit:contain; margin-bottom:14px;">
    <h2 id="gateBrand">OCTOPUS HUNTER</h2>
    <div class="gate-sub" id="gateSub">Developer Access</div>
    <input type="text" id="codeInput" class="code-input ltr" placeholder="Enter access code" autocomplete="off">
    <button class="gate-submit" id="gateSubmitBtn" onclick="submitCode()">Unlock</button>
    <div class="gate-error" id="gateError"></div>
    <button class="pill-btn" onclick="toggleLang()" style="margin-top:16px;">🌐 العربية</button>
  </div>
</div>

<header>
  <div class="top-controls" style="justify-content:center;">
    <select id="tzSelect" class="pill-btn" onchange="setTimezone(this.value)" style="outline:none; cursor:pointer;"></select>
    <button id="langBtn" class="pill-btn" onclick="toggleLang()">🌐 العربية</button>
    <button id="soundToggle" class="pill-btn" onclick="toggleSound()">🔕 Enable Sound</button>
    <button id="symbolsBtn" class="pill-btn" onclick="openSymbolsModal()">📋 Tracked Symbols</button>
    <div class="clock" id="clock">—</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:8px; margin:0 auto;">
    <img id="logoImg" src="/assets/logo-en.png" alt="Octopus Hunter" style="width:300px; height:300px; object-fit:contain;">
    <div style="display:flex; align-items:center; gap:8px;">
      <h1 id="brandName">OCTOPUS HUNTER</h1>
    </div>
    <div class="sub" id="subtitleText">Spike Signal Hub</div>
  </div>
</header>

<div class="maintenance-banner" id="maintenanceBanner"></div>

<div class="overlay" id="symbolsOverlay">
  <div class="panel">
    <div class="panel-head">
      <div class="symbol" id="symbolsModalTitle">Tracked Symbols</div>
      <button class="close-btn" onclick="closeSymbolsModal()">✕</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<div id="grid" class="grid"></div>
<div id="empty" class="empty" style="display:none;"></div>

<div class="overlay" id="overlay">
  <div class="panel" id="panel"></div>
</div>

<script>
const API_URL = '/api/latest';
const POLL_MS = 4000;
const CLOSED_VISIBLE_MS = 0;              // resolved cards are removed immediately, no afterglow window

const TRACKED_SYMBOLS = [
  'BreakX 600',
  'BreakX 1200',
  'BreakX 1800',
  'GainX 400',
  'GainX 600',
  'GainX 800',
  'GainX 999',
  'GainX 1200',
  'PainX 400',
  'PainX 600',
  'PainX 800',
  'PainX 999',
  'PainX 1200',
  'SwitchX 600',
  'SwitchX 1200',
  'SwitchX 1800',
  'TrendX 600',
  'TrendX 1200',
  'TrendX 1800',
  'FX Vol 20',
  'FX Vol 40',
  'FX Vol 60'
];

let showTpSlEnabled = false; // whether the public API is returning TP/SL (server-driven)
let exitDisplayMode = 'sltp'; // 'sltp' | 'candle' | 'none' — server-driven, defaults to existing behaviour
let candleExitBars = 20;      // configured candle-exit count, server-driven

let trackedSymbolSet = new Set(TRACKED_SYMBOLS);

function renderTrackedChips(){
  const chipsContainer = document.getElementById('chips');
  if(!chipsContainer) return;
  const sorted = Array.from(trackedSymbolSet).sort();
  chipsContainer.innerHTML = sorted.map(s => `<span class="chip ltr">${s}</span>`).join('');
}

// --- Timezone Management ------------------------------------------------
// The application uses ONE FIXED display timezone everywhere: Africa/Algiers.
// This is never derived from the browser/OS, from localStorage, or from any
// symbol/exchange-specific value. Persisted timestamps (created_at, sent_at,
// hit_time, etc.) remain untouched absolute instants — only how they are
// formatted for display is fixed here.
const APP_TIMEZONE = 'Africa/Algiers';

// TZ_STORAGE_KEY / TIMEZONE_OPTIONS / getDetectedTimezone() are kept defined
// (unused) only so nothing else in the file that might reference them by
// name breaks; none of them feed the display timezone anymore.
const TZ_STORAGE_KEY = 'octopusHunterTimezone';
const TIMEZONE_OPTIONS = [
  'UTC',
  'Africa/Algiers',
  'America/New_York',
  'America/Chicago',
  'America/Denver',
  'America/Los_Angeles',
  'America/Sao_Paulo',
  'Asia/Dubai',
  'Asia/Riyadh',
  'Asia/Kolkata',
  'Asia/Bangkok',
  'Asia/Singapore',
  'Asia/Tokyo',
  'Australia/Sydney',
  'Europe/London',
  'Europe/Paris',
  'Europe/Berlin',
  'Europe/Madrid',
  'Europe/Moscow'
];

function getDetectedTimezone(){
  try {
    return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
  } catch(e) {
    return 'UTC';
  }
}

function getTimezone(){
  // Fixed application-wide display timezone. Not read from localStorage
  // and not derived from the browser/OS.
  return APP_TIMEZONE;
}

function setTimezone(tz){
  // The display timezone is fixed (Africa/Algiers) and cannot be changed by
  // the user. This is now a no-op, kept only because the (disabled)
  // #tzSelect element's onchange attribute still references it.
}

function initTimezoneSelect(){
  const tzSelect = document.getElementById('tzSelect');
  if(!tzSelect) return;
  // Single fixed option — the selector is kept in the header so removing it
  // doesn't risk shifting the surrounding layout, but it no longer offers
  // other timezones and cannot change how timestamps are displayed.
  tzSelect.innerHTML = `<option value="${APP_TIMEZONE}" selected>${APP_TIMEZONE}</option>`;
  tzSelect.disabled = true;
}

function fmtTime(rawTs){
  if (!rawTs) return '—';
  let date;
  if (typeof rawTs === 'number') {
    date = new Date(rawTs < 1e11 ? rawTs * 1000 : rawTs);
  } else if (typeof rawTs === 'string') {
    if (!isNaN(rawTs) && !isNaN(parseFloat(rawTs))) {
      const num = Number(rawTs);
      date = new Date(num < 1e11 ? num * 1000 : num);
    } else {
      let isoStr = rawTs.includes(' ') && !rawTs.includes('T') ? rawTs.replace(' ', 'T') : rawTs;
      // Persisted timestamps are UTC. If the string carries no explicit
      // zone/offset marker, treat it as UTC (append 'Z') rather than letting
      // the JS Date parser assume the browser's local timezone for that
      // string — every timestamp then converts from the same UTC baseline
      // before being displayed in Africa/Algiers.
      if (!/[zZ]|[+-]\d{2}:?\d{2}$/.test(isoStr)) {
        isoStr += 'Z';
      }
      date = new Date(isoStr);
    }
  } else {
    date = new Date(rawTs);
  }
  if (isNaN(date.getTime())) return '—';

  try {
    return new Intl.DateTimeFormat('en-GB', {
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false,
      timeZone: getTimezone()
    }).format(date).replace(',', '');
  } catch(e) {
    return '—';
  }
}

// Signal-box time display: the ACTUAL posted/created time (HH:MM, 24h),
// converted using the same single fixed application timezone as fmtTime()
// (getTimezone() → APP_TIMEZONE, Africa/Algiers) instead of a live
// elapsed-time counter. This reads the persisted timestamp only, so it
// survives refresh — it has no dependency on page-load/timer state.
function fmtHHMM(rawTs){
  if (!rawTs) return '—';
  let date;
  if (typeof rawTs === 'number') {
    date = new Date(rawTs < 1e11 ? rawTs * 1000 : rawTs);
  } else if (typeof rawTs === 'string') {
    if (!isNaN(rawTs) && !isNaN(parseFloat(rawTs))) {
      const num = Number(rawTs);
      date = new Date(num < 1e11 ? num * 1000 : num);
    } else {
      let isoStr = rawTs.includes(' ') && !rawTs.includes('T') ? rawTs.replace(' ', 'T') : rawTs;
      // Persisted signal timestamps are UTC. If the string has no explicit
      // zone/offset marker, treat it as UTC (append 'Z') rather than letting
      // the JS Date parser fall back to the browser's local timezone for
      // that particular string — that fallback is what caused different
      // symbols/rows to appear to use different timezones, since only some
      // persisted rows carry an explicit UTC marker. Every row now converts
      // from the same UTC baseline before being displayed in Africa/Algiers.
      if (!/[zZ]|[+-]\d{2}:?\d{2}$/.test(isoStr)) {
        isoStr += 'Z';
      }
      date = new Date(isoStr);
    }
  } else {
    date = new Date(rawTs);
  }
  if (isNaN(date.getTime())) return '—';

  try {
    return new Intl.DateTimeFormat('en-GB', {
      hour: '2-digit',
      minute: '2-digit',
      hour12: false,
      timeZone: getTimezone()
    }).format(date);
  } catch(e) {
    return '—';
  }
}

// --- i18n ------------------------------------------------------------
const I18N = {
  en: {
    brandName: 'OCTOPUS HUNTER',
    devBadge: 'DEVELOPER',
    logo: '/assets/logo-en.png',
    subtitle: 'Spike Signals',
    tracked: 'Tracked symbols',
    confidence: 'composite confidence',
    entry: 'Entry', stopLoss: 'Stop Loss', takeProfit: 'Take Profit',
    opened: 'Opened', closed: 'Closed',
    timeframe: 'Timeframe', family: 'family', ticks: 'ticks',
    compression: 'Compression', velocity: 'Velocity', familySignal: 'Family signal',
    up: 'up', down: 'down', tpHit: 'TP HIT', slHit: 'SL HIT', confirmed: 'confirmed',
    emptyLine1: 'No active signals right now.',
    emptyLine2: 'The robot is watching — a box appears here the moment one fires.',
    soundOn: '🔔 Sound On', soundOff: '🔕 Enable Sound',
    langBtn: '🌐 العربية',
    disclaimer: 'Entry, SL and TP are calculated from the live price and recent ATR at signal time — a statistical estimate, not a guaranteed outcome. Synthetic index spikes have a random component; use this alongside your own risk management.',

// --- Sound notifications ----------------------------------------------
let soundEnabled = false;
let audioCtx = null;
let seenKeys = new Set();
let firstPoll = true;

function toggleSound(){
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('soundToggle');
  if(soundEnabled){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    btn.textContent = t('soundOn');
    btn.style.color = 'var(--gold)';
    btn.style.borderColor = 'var(--gold)';
    playDing();
  } else {
    btn.textContent = t('soundOff');
    btn.style.color = 'var(--muted)';
    btn.style.borderColor = 'var(--border)';
  }
}

function playDing(){
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(880, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.35);
}

function playSlAlert(){
  if(!audioCtx) return;
  [0, 0.22].forEach(delay => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(420, audioCtx.currentTime + delay);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.18);
    osc.start(audioCtx.currentTime + delay);
    osc.stop(audioCtx.currentTime + delay + 0.18);
  });
}

let slWarnedKeys = new Set();

function checkForNewSignals(data){
  const signalList = Array.isArray(data) ? data : (data?.signals || []);
  const activeNow = signalList.filter(s => (s.status || 'active') === 'active');
  const currentKeys = new Set(activeNow.map(s => s.symbol + ':' + (s.created_at || s.sent_at)));
  if(!firstPoll && soundEnabled){
    for(const s of activeNow){
      const key = s.symbol + ':' + (s.created_at || s.sent_at);
      if(!seenKeys.has(key)) { playDing(); break; }
    }
  }
  firstPoll = false;
  seenKeys = currentKeys;

  if(soundEnabled){
    const nearNow = new Set();
    for(const s of activeNow){
      const key = s.symbol + ':' + (s.created_at || s.sent_at);
      if((s.sl_proximity || 0) >= 70){
        nearNow.add(key);
        if(!slWarnedKeys.has(key)) playSlAlert();
      }
    }
    slWarnedKeys = nearNow;
  }
}

function elapsedSecondsSince(s){
  if (!s) return 0;
  const rawTs = s.created_at || s.sent_at;
  if (!rawTs) return 0;

  let createdMs;
  if (typeof rawTs === 'number') {
    createdMs = rawTs < 1e11 ? rawTs * 1000 : rawTs;
  } else if (typeof rawTs === 'string') {
    if (!isNaN(rawTs) && !isNaN(parseFloat(rawTs))) {
      const num = Number(rawTs);
      createdMs = num < 1e11 ? num * 1000 : num;
    } else {
      const isoStr = rawTs.includes(' ') && !rawTs.includes('T') ? rawTs.replace(' ', 'T') : rawTs;
      createdMs = new Date(isoStr).getTime();
    }
  } else {
    createdMs = new Date(rawTs).getTime();
  }

  if (isNaN(createdMs)) return 0;
  return Math.max(0, Math.floor((Date.now() - createdMs) / 1000));
}

function formatAgo(sec){
  if(sec < 60) return sec + 's ago';
  if(sec < 3600) return Math.floor(sec/60) + 'm ago';
  return Math.floor(sec/3600) + 'h ago';
}

// --- Access gate --------------------------------------------------------
const CODE_STORAGE_KEY = 'octopusHunterDevCode';
let accessCode = localStorage.getItem(CODE_STORAGE_KEY);
let gateOpen = true; // true = gate is showing, dashboard polling is paused

function showGate(errorKey){
  gateOpen = true;
  document.getElementById('accessGate').classList.remove('hidden');
  const errBox = document.getElementById('gateError');
  errBox.textContent = errorKey ? t(errorKey) : '';
}

function hideGate(){
  gateOpen = false;
  document.getElementById('accessGate').classList.add('hidden');
}

async function verifyCode(code){
  try{
    const res = await fetch('/api/verify-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    return await res.json();
  }catch(e){
    return { valid: false, reason: 'server_error' };
  }
}

async function submitCode(){
  const input = document.getElementById('codeInput');
  const code = input.value.trim();
  if(!code) return;

  const btn = document.getElementById('gateSubmitBtn');
  btn.disabled = true;
  btn.textContent = t('gateChecking');

  const result = await verifyCode(code);

  btn.disabled = false;
  btn.textContent = t('gateUnlock');

  if(result.valid){
    accessCode = code;
    localStorage.setItem(CODE_STORAGE_KEY, code);
    hideGate();
    poll();
  } else {
    const key = result.reason === 'expired' ? 'gateErrorExpired'
              : result.reason === 'not_found' ? 'gateErrorInvalid'
              : 'gateErrorServer';
    document.getElementById('gateError').textContent = t(key);
  }
}

document.getElementById('codeInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') submitCode();
});

async function checkStoredCode(){
  if(!accessCode){
    showGate();
    return;
  }
  const result = await verifyCode(accessCode);
  if(result.valid){
    hideGate();
    poll();
  } else {
    localStorage.removeItem(CODE_STORAGE_KEY);
    accessCode = null;
    showGate(result.reason === 'expired' ? 'gateErrorExpired' : 'gateErrorInvalid');
  }
}

// --- Rendering ----------------------------------------------------------
function gaugeSVG(confidence, color){
  const r = 30, c = 2*Math.PI*r;
  const offset = c - (confidence/100)*c;
  return `
    <svg width="76" height="76" viewBox="0 0 76 76">
      <circle cx="38" cy="38" r="${r}" stroke="#1c2230" stroke-width="6" fill="none"/>
      <circle cx="38" cy="38" r="${r}" stroke="${color}" stroke-width="6" fill="none"
        stroke-dasharray="${c}" stroke-dashoffset="${offset}"
        stroke-linecap="round" transform="rotate(-90 38 38)"/>
    </svg>`;
}

function confirmBadge(confirmations){
  if(confirmations === undefined || confirmations === null) return '';
  const tier = confirmations >= 3 ? 'tier-3' : confirmations >= 2 ? 'tier-2' : 'tier-1';
  return `<span class="confirm-badge ${tier}">${confirmations}/3 ${t('confirmed')}</span>`;
}

function isVisible(s){
  const status = s.status || 'active';
  return status === 'active';
}

let lastData = [];

function renderGrid(data){
  if (data && data.maintenance) {
    const banner = document.getElementById('maintenanceBanner');
    banner.textContent = t('maintenanceBanner');
    banner.classList.add('show');
  }

  const isMaintenance = document.getElementById('maintenanceBanner').classList.contains('show');
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');

  if (isMaintenance) {
    grid.innerHTML = '';
    grid.style.display = 'none';
    empty.style.display = 'none';
    return;
  }

  grid.style.display = 'grid';
  const signalList = Array.isArray(data) ? data : (data?.signals || []);
  lastData = data;

  // Auto-register any new symbols returned by api/latest.js in the symbols chip list
  signalList.forEach(s => {
    if(s.symbol && !trackedSymbolSet.has(s.symbol)){
      trackedSymbolSet.add(s.symbol);
      renderTrackedChips();
    }
  });

  const visible = signalList.filter(isVisible);

  if(visible.length === 0){
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  const sorted = [...visible].sort((a,b) => {
    const aActive = (a.status || 'active') === 'active';
    const bActive = (b.status || 'active') === 'active';
    if(aActive !== bActive) return aActive ? -1 : 1;
    return b.confidence - a.confidence;
  });

  grid.innerHTML = sorted.map((s, i) => {
    const status = s.status || 'active';
    const isClosed = status !== 'active';
    const colorHex = s.direction === 'up' ? '#35c77e' : '#e5484d';
    const nearSL = !isClosed && (s.sl_proximity || 0) >= 70;

    // Exit/display info block. Exactly one of three modes, server-driven via exitDisplayMode:
    //  - 'sltp'   (existing behaviour, unchanged): compact ENTRY/SL/TP price block.
    //  - 'candle' : hides prices, shows the configured candle-exit count instead.
    //  - 'none'   : hides both.
    let tpSlHtml = '';
    if(exitDisplayMode === 'sltp'){
      tpSlHtml = showTpSlEnabled && (s.entry_price !== undefined || s.sl_price !== undefined || s.tp_price !== undefined) ? `
      <div style="font-family:'IBM Plex Mono',monospace; font-size:12px; margin:6px 0; color:var(--muted);" class="ltr">
        <div style="display:flex; justify-content:space-between;"><span>ENTRY</span><span>${fmtPrice(s.entry_price)}</span></div>
        <div style="display:flex; justify-content:space-between;"><span>SL</span><span>${fmtPrice(s.sl_price)}</span></div>
        <div style="display:flex; justify-content:space-between;"><span>TP</span><span>${fmtPrice(s.tp_price)}</span></div>
      </div>` : '';
    } else if(exitDisplayMode === 'candle'){
      tpSlHtml = `
      <div style="font-family:'IBM Plex Mono',monospace; font-size:12px; margin:6px 0; color:var(--muted); text-align:center;" class="ltr">
        ${t('candleStopTemplate').replace('{n}', candleExitBars)}
      </div>`;
    }

    return `
    <div class="card ${isClosed ? 'closed' : ''} ${nearSL ? 'urgent' : ''}" style="cursor:default;">
      <div class="symbol ltr">${s.symbol}</div>
      <div class="dir ${s.direction}">${s.direction === 'up' ? '▲ ' + t('up') : '▼ ' + t('down')}</div>
      ${isClosed
        ? `<div class="closed-badge ${status === 'tp_hit' ? 'tp' : 'sl'}">${status === 'tp_hit' ? t('tpHit') : t('slHit')}</div>`
        : nearSL
          ? `<div class="closed-badge sl">⚠ ${t('nearSL')} (${Math.round(s.sl_proximity)}%)</div>`
          : ''}
      <div class="gauge-wrap">
        ${gaugeSVG(s.confidence, isClosed ? '#3a4356' : colorHex)}
        <div class="gauge-num">${Math.round(s.confidence)}</div>
      </div>
      <div class="gauge-label" style="text-align:center; margin-bottom:8px;">${t('confidence')}</div>

      ${tpSlHtml}

      <div class="foot-row">
        <span class="tf ltr">${s.timeframe || ''}${s.family ? ' · ' + s.family : ''}</span>
        <span class="countdown ltr">${fmtHHMM(s.created_at || s.sent_at)}</span>
      </div>
    </div>`;
  }).join('');

  window.__signals = sorted;
}

function fmtPrice(v){
  if(v === null || v === undefined) return '—';
  return Number(v).toFixed(v >= 100 ? 2 : 5);
}

function openDetail(i){
  const s = window.__signals[i];
  const panel = document.getElementById('panel');
  const isUp = s.direction === 'up';
  const status = s.status || 'active';
  const isClosed = status !== 'active';
  const nearSL = !isClosed && (s.sl_proximity || 0) >= 70;

  const countdownHtml = `<div class="countdown-big ltr ${nearSL ? 'urgent' : ''}">${nearSL ? '⚠ ' + t('nearSL') + ' (' + Math.round(s.sl_proximity) + '%) · ' : ''}${fmtHHMM(s.created_at || s.sent_at)}</div>`;

  const openedTimeStr = fmtTime(s.created_at || s.sent_at);
  const closedTimeStr = s.hit_time ? fmtTime(s.hit_time) : null;

  panel.innerHTML = `
    <div class="panel-head">
      <div>
        <div class="symbol ltr">${s.symbol}</div>
        <div class="dir ${s.direction}" style="color:${isUp ? 'var(--up)' : 'var(--down)'}">
          ${isUp ? '▲ ' + t('up') : '▼ ' + t('down')}
        </div>
      </div>
      <button class="close-btn" onclick="closeDetail()">✕</button>
    </div>

    <div class="confidence-big">
      <div class="num">${s.confidence.toFixed(1)}%</div>
      <div class="lbl">${t('confidence')} ${isClosed ? '· ' + (status === 'tp_hit' ? t('tpHit') : t('slHit')) : ''}</div>
      <div style="margin-top:10px;">${confirmBadge(s.confirmations)}</div>
    </div>

    ${countdownHtml}

    ${ exitDisplayMode === 'sltp' && showTpSlEnabled && (s.entry_price !== undefined || s.sl_price !== undefined || s.tp_price !== undefined) ? `
    <div class="levels">
      <div class="level-box entry">
        <div class="l-label">${t('entry')}</div>
        <div class="l-value ltr">${fmtPrice(s.entry_price)}</div>
      </div>
      <div class="level-box sl">
        <div class="l-label">${t('stopLoss')}</div>
        <div class="l-value ltr">${fmtPrice(s.sl_price)}</div>
      </div>
      <div class="level-box tp">
        <div class="l-label">${t('takeProfit')}</div>
        <div class="l-value ltr">${fmtPrice(s.tp_price)}</div>
      </div>
    </div>` : '' }
    ${ exitDisplayMode === 'candle' ? `
    <div class="levels">
      <div class="level-box entry">
        <div class="l-label">${t('candleExitLabel')}</div>
        <div class="l-value ltr">${candleExitBars}</div>
      </div>
    </div>` : '' }

    <div class="meta-row">
      <span class="ltr">${s.family || ''} ${t('family')}${s.ticks_since_jump !== undefined && s.expected_gap_ticks ? ' · ' + s.ticks_since_jump + '/' + s.expected_gap_ticks + ' ' + t('ticks') : ''}</span>
      <span class="ltr">${t('timeframe')}: ${s.timeframe || '—'}</span>
    </div>
    <div class="meta-row">
      <span class="ltr">${t('opened')}: ${openedTimeStr}</span>
      ${closedTimeStr ? `<span class="ltr">${t('closed')}: ${closedTimeStr}</span>` : ''}
    </div>

    <div class="components">
      ${compRow(t('compression'), s.compression)}
      ${compRow(t('velocity'), s.velocity)}
      ${compRow(t('familySignal') + ' (' + (s.family || '—') + ')', s.family_score ?? s.time_since_spike)}
    </div>

    <div class="disclaimer">${t('disclaimer')}</div>
  `;
  document.getElementById('overlay').classList.add('show');
}

function compRow(name, val){
  return `
    <div class="comp-row">
      <div class="top"><span class="name">${name}</span><span class="val ltr">${val?.toFixed(1) ?? '—'}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${val ?? 0}%"></div></div>
    </div>`;
}

function closeDetail(){
  document.getElementById('overlay').classList.remove('show');
}

function openSymbolsModal(){
  document.getElementById('symbolsOverlay').classList.add('show');
}

function closeSymbolsModal(){
  document.getElementById('symbolsOverlay').classList.remove('show');
}

async function poll(){
  if(gateOpen || !accessCode) return;
  checkHeartbeat();
  try{
    // Add a cache-busting query param to reduce CDN staleness if needed
    const res = await fetch(API_URL + '?code=' + encodeURIComponent(accessCode) + '&_cb=' + Date.now());
    if(res.status === 401){
      localStorage.removeItem(CODE_STORAGE_KEY);
      accessCode = null;
      showGate('gateErrorExpired');
      return;
    }
    const data = await res.json();

    // Determine whether server included TP/SL fields (server drives visibility)
    if (Array.isArray(data)) {
      showTpSlEnabled = data.some(r => Object.prototype.hasOwnProperty.call(r, 'entry_price'));
      exitDisplayMode = 'sltp'; // legacy bare-array shape carries no mode info — default preserves existing behaviour
      candleExitBars = 20;
    } else if (data && Array.isArray(data.signals)) {
      showTpSlEnabled = data.signals.some(r => Object.prototype.hasOwnProperty.call(r, 'entry_price'));
      exitDisplayMode = data.exit_display_mode || 'sltp';
      candleExitBars = data.candle_exit_bars || 20;
    } else {
      showTpSlEnabled = false;
      exitDisplayMode = 'sltp';
      candleExitBars = 20;
    }

    checkForNewSignals(data);
    renderGrid(data);
  }catch(e){
    console.error('Failed to fetch signals', e);
  }
}

async function checkHeartbeat(){
  try{
    const res = await fetch('/api/heartbeat');
    const data = await res.json();
    const banner = document.getElementById('maintenanceBanner');
    if(!data.online || data.maintenance){
      banner.textContent = t('maintenanceBanner');
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
    renderGrid(lastData || []);
  }catch(e){
  }
}

function updateClock(){
  const tz = getTimezone();
  const now = new Date();
  try {
    const timeStr = new Intl.DateTimeFormat('en-GB', {
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false,
      timeZone: tz
    }).format(now);
    document.getElementById('clock').textContent = `${timeStr} (${tz})`;
  } catch(e) {
    document.getElementById('clock').textContent = now.toUTCString().slice(17,25) + ' UTC';
  }
}

applyStaticText();
checkStoredCode();
setInterval(poll, POLL_MS);
setInterval(() => { if(!gateOpen) renderGrid(lastData); }, 1000);
updateClock();
setInterval(updateClock, 1000);
</script>
